repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint and imports
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: black
        name: Black
        entry: uv run --locked black
        language: system
        types: [python]
      - id: vulture
        name: Vulture
        entry: uv run --locked vulture
        language: system
        pass_filenames: false
        always_run: true
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: Check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-json
        name: Check JSON
        entry: uv run --locked check-json
        language: system
        types: [json]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
